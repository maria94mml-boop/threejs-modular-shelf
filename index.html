<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Configurator</title>
    <style>
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 8px;
      font-family: sans-serif;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #side-controls {
      position: absolute;
      top: 25px;
      right: 20px;

      display: flex;
      flex-direction: column;
      gap: 12px;

      z-index: 50;
    }

    #side-controls button {
      width: 50px;
      height: 50px;
      border-radius: 50%;

      border: none;
      background: #e0e0e0;
      color: white;
      cursor: pointer;

      font-size: 10px;
    }

    #side-controls button:hover {
      background: rgb(149, 149, 149)e4e;
    }
    #exitHide {
      position: absolute;
      top: 25px;
      right: 20px;

      width: 50px;
      height: 50px;
      border-radius: 50%;

      border: none;
      background: #e0e0e0;
      color: rgb(0, 0, 0);

      font-size: 22px;
      cursor: pointer;

      z-index: 50;
      display: none;
    }

    #exitHide:hover {
      background: rgb(149, 149, 149)e4e;
    }
    #jsonWidget {
      position: absolute;
      bottom: 20px;
      right: 20px;

      width: 360px;
      max-height: 50vh;

      background: #111;
      color: #eee;
      border-radius: 8px;
      padding: 12px;

      display: none;
      flex-direction: column;
      z-index: 40;
    }

    .json-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .json-header button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #jsonOutput {
      background: #1c1c1c;
      padding: 8px;
      border-radius: 4px;
      overflow: auto;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .json-actions {
      display: flex;
      gap: 8px;
    }

    .json-actions button {
      flex: 1;
      padding: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
    <div id="side-controls">
        <button id="toggleHide">
          <img src="./icons/hide.png" alt="Hide UI" width="24" height="24">
        </button>
        <button id="toggleHelpers">
          <img src="./icons/helpers.png" alt="Toggle Helpers" width="24" height="24">
        </button>
        <button id="saveConfig">
          <img src="./icons/json.png" alt="json" width="24" height="24">
        </button>
    </div>
    <button id="exitHide" aria-label="Salir">✕</button>

    <div id="ui">
      <div class="controls">
        <h5>Estantes:</h5>
        <button id="removeLevel">−</button>
        <span id="levelCount">1</span>
        <button id="addLevel">+</button>
        
      </div>
      <div class="dimensions">
        <h5>Dimensiones:</h5>
        <div>Ancho: <span id="dimWidth"></span> cm</div>
        <div>Fondo: <span id="dimDepth"></span> cm</div>
        <div>Altura módulo: <span id="dimModuleHeight"></span> cm</div>
        <div class="height-control">
          <label>
            Altura total (cm):
            <input id="heightInput" type="number" step="30" min="30">
          </label>
        </div>
      </div>
      

    </div>
    <div id="jsonWidget">
      <div class="json-header">
        <span>Configuración JSON</span>
        <button id="closeJson">✕</button>
      </div>

      <pre id="jsonOutput"></pre>

      <div class="json-actions">
        <button id="copyJson">Copiar</button>
        <button id="downloadJson">Guardar</button>
      </div>
    </div>
      
  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script type= "module" src="main.js"></script>

</body>
</html>
